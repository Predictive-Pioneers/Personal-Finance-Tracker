{% extends "base.html" %}
{% block title %}Edit Transaction{% endblock %}
{% block content %}

<h1 class="mb-4">✏️ Edit Transaction</h1>

<div class="card">
    <div class="card-body">
        <form action="{{ url_for('update_transaction', txn_id=transaction.id) }}" method="POST" class="row g-3">
            <div class="col-md-3">
                <label class="form-label">Date</label>
                <input type="date" name="date" class="form-control" value="{{ transaction.date }}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Time</label>
                <input type="time" name="time" class="form-control" value="{{ transaction.time }}" required>
            </div>
            <div class="col-md-3">
                <label class="form-label">Category</label>
                <select name="category" class="form-select" required>
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if cat == transaction.category %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Type</label>
                <select name="type" class="form-select">
                    <option value="Income" {% if transaction.type == "Income" %}selected{% endif %}>Income</option>
                    <option value="Expense" {% if transaction.type == "Expense" %}selected{% endif %}>Expense</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">Amount</label>
                <input type="number" step="0.01" name="amount" class="form-control" value="{{ transaction.amount }}" required>
            </div>
            <div class="col-md-2">
                <label class="form-label">Note</label>
                <input type="text" name="note" class="form-control" value="{{ transaction.note }}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Update</button>
                <a href="{{ url_for('transactions_page') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

{% endblock %}
