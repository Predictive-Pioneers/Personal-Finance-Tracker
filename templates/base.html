<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Finance Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        html { scroll-behavior: smooth; }

        body {
            margin: 0;
        }

        /* ---- Sidebar ---- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background: linear-gradient(180deg, #1e1e3f 0%, #2b2b55 100%);
            color: #fff;
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar .nav-link {
            color: #cfcfff;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .sidebar .nav-link.active {
            background: linear-gradient(90deg, #7b61ff, #5a4fff);
            color: #fff;
            font-weight: 600;
        }

        .sidebar-footer {
            margin-top: auto;
        }

        /* ---- Main content ---- */
        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }
    </style>
</head>
<body data-bs-theme="light" id="pageBody">

<div class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-piggy-bank-fill"></i> Finance Tracker
    </div>

    <nav class="flex-grow-1">
        <a href="{{ url_for('dashboard') }}" class="nav-link {% if request.path == url_for('dashboard') %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="{{ url_for('add_page') }}" class="nav-link {% if request.path == url_for('add_page') %}active{% endif %}">
            <i class="bi bi-plus-circle"></i> Add Transaction
        </a>
        <a href="{{ url_for('transactions_page') }}" class="nav-link {% if request.path == url_for('transactions_page') %}active{% endif %}">
            <i class="bi bi-list-ul"></i> Transactions
        </a>
        <a href="{{ url_for('charts_page') }}" class="nav-link {% if request.path == url_for('charts_page') %}active{% endif %}">
            <i class="bi bi-bar-chart-fill"></i> Charts
        </a>
        <a href="{{ url_for('budget_page') }}" class="nav-link {% if request.path == url_for('budget_page') %}active{% endif %}">
            <i class="bi bi-bullseye"></i> Budget
        </a>
        <a href="{{ url_for('categories_page') }}" class="nav-link {% if request.path == url_for('categories_page') %}active{% endif %}">
            <i class="bi bi-tags-fill"></i> Categories
        </a>
        <a href="{{ url_for('goals_page') }}" class="nav-link {% if request.path == url_for('goals_page') %}active{% endif %}">
            <i class="bi bi-trophy-fill"></i> Savings Goals
        </a>
    </nav>

    <div class="sidebar-footer">
        <hr style="border-color: rgba(255,255,255,0.2);">
        <div class="text-light mb-2">
            <i class="bi bi-person-circle"></i> {{ session['username'] }}
        </div>
        <a href="{{ url_for('logout') }}" class="nav-link mb-2">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
        <div class="form-check form-switch text-light">
            <input class="form-check-input" type="checkbox" id="themeToggle">
            <label class="form-check-label" for="themeToggle">🌙 Dark Mode</label>
        </div>
    </div>

</div>

<div class="main-content">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const themeToggle = document.getElementById("themeToggle");
    const body = document.getElementById("pageBody");
    const savedTheme = localStorage.getItem("theme") || "light";
    body.setAttribute("data-bs-theme", savedTheme);
    themeToggle.checked = savedTheme === "dark";
    themeToggle.addEventListener("change", function () {
        const newTheme = themeToggle.checked ? "dark" : "light";
        body.setAttribute("data-bs-theme", newTheme);
        localStorage.setItem("theme", newTheme);
    });
</script>
</body>
</html>
