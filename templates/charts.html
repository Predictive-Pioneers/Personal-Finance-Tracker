{% extends "base.html" %}
{% block title %}Charts{% endblock %}
{% block content %}

<h1 class="mb-4">📊 Charts</h1>

<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Expenses by Category</h5>
                <img src="{{ url_for('static', filename='pie_chart_' + username + '.png') }}" class="img-fluid">
            </div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Income vs Expense</h5>
                <img src="{{ url_for('static', filename='bar_chart_' + username + '.png') }}" class="img-fluid">
            </div>
        </div>
    </div>
</div>

{% endblock %}
